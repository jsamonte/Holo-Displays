<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holo-Displays Test Client</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d25; --line: #2b303b; --text: #e6e9ef;
    --dim: #8b93a7; --ok: #51cf66; --warn: #ffd43b; --bad: #ff6b6b; --accent: #4dabf7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 12px 16px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  input {
    background: #0e1016; border: 1px solid var(--line); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font: inherit; width: 200px;
  }
  button {
    background: #262b36; border: 1px solid var(--line); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #313845; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.live { background: var(--ok); }
  #stats { color: var(--dim); margin-left: auto; }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .card h2 .meta { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: auto; }
  .shot { width: 100%; display: block; background: #000; aspect-ratio: 16/9; object-fit: contain; }
  .controls { padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .controls .label { color: var(--dim); font-size: 12px; }
  select { background: #0e1016; border: 1px solid var(--line); color: var(--text); padding: 5px 8px; border-radius: 6px; font: inherit; }
  #log { margin: 0 16px 16px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; height: 180px; overflow: auto; white-space: pre-wrap; font-size: 12px; color: var(--dim); }
  .empty { padding: 40px 16px; text-align: center; color: var(--dim); }
</style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <input id="addr" value="ws://127.0.0.1:8880" spellcheck="false">
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <span id="stats"></span>
</header>

<main id="grid"><div class="empty">Not connected.</div></main>
<pre id="log"></pre>

<script>
// Stand-in for the glasses. Speaks the protocol in docs/PROTOCOL.md so the host
// can be tested without wearing the Spectacles, and doubles as the reference
// implementation when the lens misbehaves.

const $ = id => document.getElementById(id);
const grid = $('grid'), logEl = $('log');

let ws = null;
let pendingHeader = null;      // frame header awaiting its binary message
let displays = new Map();      // id -> {info, el}
let frames = 0, bytes = 0;

function log(msg) {
  const t = new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function connect() {
  const url = $('addr').value.trim();
  log(`connecting to ${url}`);
  ws = new WebSocket(url);
  ws.binaryType = 'blob';

  ws.onopen = () => {
    $('dot').classList.add('live');
    $('connect').disabled = true;
    $('disconnect').disabled = false;
    log('open; sending hello');
    send({ t: 'hello', client: 'test-client', ver: 1 });
  };

  ws.onmessage = async ev => {
    if (typeof ev.data === 'string') return handleText(ev.data);
    await handleBinary(ev.data);
  };

  ws.onclose = e => {
    $('dot').classList.remove('live');
    $('connect').disabled = false;
    $('disconnect').disabled = true;
    log(`closed (code ${e.code})`);
  };

  ws.onerror = () => log('socket error');
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function handleText(text) {
  let msg;
  try { msg = JSON.parse(text); } catch { return log('bad JSON: ' + text.slice(0, 120)); }

  switch (msg.t) {
    case 'displays':
      log(`displays: ${msg.list.map(d => `${d.id}:${d.w}x${d.h}`).join('  ') || '(none)'}`);
      rebuild(msg.list);
      break;

    case 'frame':
      // Remember it; the JPEG arrives as the very next message.
      pendingHeader = msg;
      break;

    case 'mode_changed':
      log(msg.ok
        ? `mode_changed ${msg.id} -> ${msg.w}x${msg.h} OK`
        : `mode_changed ${msg.id} FAILED: ${msg.err}`);
      break;

    default:
      log('unknown message type: ' + msg.t);
  }
}

async function handleBinary(blob) {
  if (!pendingHeader) return log('binary with no header, dropped');
  const h = pendingHeader;
  pendingHeader = null;

  const entry = displays.get(h.id);
  if (!entry) return;

  const url = URL.createObjectURL(blob);
  const img = entry.el.querySelector('img');
  const previous = img.dataset.url;

  await new Promise(res => { img.onload = res; img.onerror = res; img.src = url; });
  if (previous) URL.revokeObjectURL(previous);   // or memory grows without bound
  img.dataset.url = url;

  frames++;
  bytes += blob.size;
  entry.el.querySelector('.meta').textContent =
    `${h.w}x${h.h}  seq ${h.seq}  ${(blob.size / 1024).toFixed(0)} KB`;

  // Ack only now, once it is actually decoded and on screen. That is what the
  // host's one-frame-in-flight rule measures.
  send({ t: 'ack', id: h.id, seq: h.seq });
}

function rebuild(list) {
  grid.innerHTML = '';
  displays.clear();

  if (!list.length) {
    grid.innerHTML = '<div class="empty">Host reports no streamed displays.<br>' +
      'Tick one in the host UI, or install VDD so there is a virtual monitor.</div>';
    return;
  }

  for (const info of list) {
    const card = document.createElement('div');
    card.className = 'card';

    const modes = info.modes.map(([w, h]) =>
      `<option value="${w}x${h}"${w === info.w && h === info.h ? ' selected' : ''}>${w} x ${h}</option>`).join('');

    card.innerHTML = `
      <h2>${info.id} &nbsp; ${info.name}<span class="meta">waiting…</span></h2>
      <img class="shot" alt="display ${info.id}">
      <div class="controls">
        <span class="label">tier</span>
        <button data-tier="full">full</button>
        <button data-tier="low">low</button>
        <button data-tier="off">off</button>
        <span class="label" style="margin-left:10px">resolution</span>
        <select>${modes}</select>
        <button class="resize">Apply</button>
      </div>`;

    card.querySelectorAll('[data-tier]').forEach(btn => {
      btn.onclick = () => {
        card.querySelectorAll('[data-tier]').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        send({ t: 'visibility', id: info.id, tier: btn.dataset.tier });
        log(`visibility ${info.id} -> ${btn.dataset.tier}`);
      };
    });

    card.querySelector('.resize').onclick = () => {
      const [w, h] = card.querySelector('select').value.split('x').map(Number);
      send({ t: 'resize', id: info.id, w, h });
      log(`resize ${info.id} -> ${w}x${h}`);
    };

    grid.appendChild(card);
    displays.set(info.id, { info, el: card });

    // Start every panel at full so there is something to look at immediately.
    const fullBtn = card.querySelector('[data-tier="full"]');
    fullBtn.classList.add('on');
    send({ t: 'visibility', id: info.id, tier: 'full' });
  }
}

setInterval(() => {
  $('stats').textContent = `${frames} frames   ${(bytes / 1024 / 1024).toFixed(1)} MB`;
  frames = frames; // cumulative on purpose
}, 500);

$('connect').onclick = connect;
$('disconnect').onclick = () => ws && ws.close();
$('addr').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
